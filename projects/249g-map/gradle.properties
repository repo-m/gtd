org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# No system JDK is installed on this host (/usr/bin/java is a stub that errors with
# "Unable to locate a Java Runtime"). Pin Gradle's JDK to the JBR bundled with Android
# Studio so `./gradlew` works from any invocation (interactive shell, loop.sh, launchd
# scheduler) without depending on JAVA_HOME being exported in that process's environment.
org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
